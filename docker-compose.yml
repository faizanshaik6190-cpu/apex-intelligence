version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: apex_intelligence
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  apex:
    build: .
    ports:
      - "8000:8000"
      - "5555:5555"
      - "9001:9001"
    environment:
      DATABASE_URL: postgresql://apex_user:apex_secure_password_change_me@postgres:5432/apex_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      DEBUG: "false"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./logs:/app/logs
      - ./apex_intelligence.db:/app/apex_intelligence.db
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
