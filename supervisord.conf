[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --port 6379
autostart=true
autorestart=true
stderr_logfile=/app/logs/redis.log
stdout_logfile=/app/logs/redis.log

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/fastapi.log
stdout_logfile=/app/logs/fastapi.log
environment=PYTHONUNBUFFERED=1

[program:celery_worker]
command=celery -A integrations.celery_tasks worker --loglevel=info
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/celery_worker.log
stdout_logfile=/app/logs/celery_worker.log
environment=PYTHONUNBUFFERED=1

[program:celery_beat]
command=celery -A integrations.celery_tasks beat --loglevel=info
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/celery_beat.log
stdout_logfile=/app/logs/celery_beat.log
environment=PYTHONUNBUFFERED=1

[inet_http_server]
port=0.0.0.0:9001

[supervisorctl]
serverurl=http://localhost:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
